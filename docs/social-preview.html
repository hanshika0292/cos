<!doctype html>
<html><head><meta charset="utf-8"><title>cos social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; color: #f2f1ee;
    background:
      radial-gradient(900px 520px at 88% 30%, rgba(236, 131, 90, .30), transparent 60%),
      radial-gradient(700px 500px at 70% 110%, rgba(208, 59, 59, .22), transparent 60%),
      linear-gradient(135deg, #121212 0%, #17120f 55%, #1d1410 100%);
    display: grid; grid-template-columns: 1fr 380px; gap: 40px; padding: 58px 64px 52px 80px;
  }
  .left { display: flex; flex-direction: column; }
  .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #ec835a; }
  h1 { font-family: "SF Mono", Menlo, monospace; font-size: 120px; font-weight: 700; letter-spacing: -.04em; line-height: 1; margin-top: 18px; }
  h1 .p { color: #ec835a; font-weight: 500; margin-right: .12em; }
  .tag { font-size: 34px; line-height: 1.3; color: #d9d6cf; margin-top: 26px; max-width: 690px; font-weight: 500; }
  .tag b { color: #fff; font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; }
  .chip { font-size: 22px; font-weight: 600; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.08);
          box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); color: #f2f1ee; }
  .chip.hot { background: rgba(236,131,90,.18); box-shadow: inset 0 0 0 1.5px rgba(236,131,90,.55); }
  .url { font-size: 21px; color: #9c9a92; margin-top: 22px; letter-spacing: .01em; }
  .right { display: flex; flex-direction: column; align-items: center; }
  .menubar { align-self: stretch; height: 40px; border-radius: 10px; background: rgba(40,40,40,.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
             display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 16px; font-size: 19px; color: #e9e7e2; }
  .menubar .item { padding: 3px 10px; border-radius: 6px; background: rgba(255,255,255,.16); font-weight: 600; }
  .menubar .dim { color: #8d8b85; font-size: 17px; }
  /* the real SwiftBar menu from docs/menu-bar.png (demo data), cropped to the menu card */
  .panel { margin-top: 10px; width: 360px; height: 452px; border-radius: 12px; overflow: hidden; position: relative;
           box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 30px 70px rgba(0,0,0,.55); }
  .panel img { position: absolute; width: 443.5px; left: -41.7px; top: -29.2px; }
</style></head>
<body>
  <div class="left">
    <div class="eyebrow">macOS menu bar + CLI · open source</div>
    <h1><span class="p">$</span>cos</h1>
    <p class="tag"><b>A chief of staff for parallel coding agents.</b> Track every Claude Code, Gemini CLI and Codex session across terminals and VMs, and see which one needs you.</p>
    <div class="chips">
      <span class="chip hot">Claude Code</span>
      <span class="chip hot">Gemini CLI</span>
      <span class="chip hot">Codex</span>
      <span class="chip">Free · MIT</span>
    </div>
    <div class="url">github.com/hanshika0292/cos</div>
  </div>
  <div class="right">
    <div class="menubar"><span class="dim">Wi‑Fi</span><span class="item">⚙️1 ✅2</span><span class="dim">Thu 14:56</span></div>
    <div class="panel"><img src="menu-bar.png" alt=""></div>
  </div>
</body></html>
